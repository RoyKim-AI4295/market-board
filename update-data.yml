name: 시세 업데이트

on:
  schedule:
    # GitHub은 UTC 기준 → 한국 시간 = UTC + 9시간
    - cron: "0 1-6 * * 1-5"     # 한국 장중: 평일 10:00 ~ 15:00 매시 정각
    - cron: "40 6 * * 1-5"      # 국내 증시 마감 후: 평일 15:40
    - cron: "0 14-21 * * 1-5"   # 미국 장중: 한국 시간 23:00 ~ 다음 날 06:00 매시 정각 (월~금 밤)
    - cron: "30 21 * * *"       # 미국 증시 마감 후: 매일 06:30
    - cron: "0 0,9,12 * * *"    # 뉴스·가상자산: 매일 09:00, 18:00, 21:00
    - cron: "0 3 * * 0,6"       # 주말 낮 12:00 (평일 12시는 장중 업데이트에 포함)
  workflow_dispatch:          # Actions 탭에서 수동 실행 버튼

concurrency:                  # 앞 실행이 끝나기 전에 다음 실행이 겹치지 않게
  group: market-update
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python fetch_data.py
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      - name: 변경된 데이터 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || (git commit -m "시세 업데이트 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')" && git pull --rebase && git push)
      - name: 개편안 알림 보내기
        if: hashFiles('alert.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "[개편안 알림] 장특공제 개편 관련 새 기사 $(TZ=Asia/Seoul date '+%m/%d %H:%M')" --body-file alert.md
