name: 시세 업데이트

on:
  schedule:
    - cron: "40 6 * * 1-5"    # 한국 시간 평일 15:40 (국내 증시 마감 후)
    - cron: "30 21 * * 1-5"   # 한국 시간 화~토 06:30 (미국 증시 마감 후)
  workflow_dispatch:          # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python fetch_data.py
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      - name: 변경된 데이터 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          git diff --staged --quiet || (git commit -m "시세 업데이트 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')" && git push)
